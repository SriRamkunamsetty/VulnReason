version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vulnreason-db
    environment:
      POSTGRES_USER: vulnreason
      POSTGRES_PASSWORD: vulnreason_secure_pass_2026
      POSTGRES_DB: vulnreason
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnreason -d vulnreason"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vulnreason-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnreason-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://vulnreason:vulnreason_secure_pass_2026@db:5432/vulnreason
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: vulnreason-production-master-secret-key-32chars-min!
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnreason-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

name: VulnReason Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r <(python -c "import tomllib; [print(d) for d in tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['dependencies']]")
          pip install pytest pytest-asyncio hypothesis pytest-cov

      - name: Run Database Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Test Suite (Unit, Integration, Security, Property-Based)
        run: |
          cd backend
          pytest tests -v --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
